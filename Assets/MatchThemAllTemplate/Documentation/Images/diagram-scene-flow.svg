<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="900" height="250" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="600" fill="#222">Scene flow (File ▸ Build Profiles, in this order)</text>

  <g font-size="14" text-anchor="middle">
    <rect x="20" y="70" width="140" height="70" rx="10" fill="#e8f1ff" stroke="#3b78d8" stroke-width="2"/>
    <text x="90" y="100" font-weight="600" fill="#1d3f7a">OpenScene</text>
    <text x="90" y="120" font-size="12" fill="#444">splash · consent</text>

    <rect x="200" y="70" width="140" height="70" rx="10" fill="#e8f1ff" stroke="#3b78d8" stroke-width="2"/>
    <text x="270" y="100" font-weight="600" fill="#1d3f7a">Lobby</text>
    <text x="270" y="120" font-size="12" fill="#444">Play · Shop · Daily</text>

    <rect x="380" y="70" width="140" height="70" rx="10" fill="#e8f1ff" stroke="#3b78d8" stroke-width="2"/>
    <text x="450" y="100" font-weight="600" fill="#1d3f7a">LevelSelect</text>
    <text x="450" y="120" font-size="12" fill="#444">saga map</text>

    <rect x="560" y="70" width="140" height="70" rx="10" fill="#f3f3f3" stroke="#888" stroke-width="2"/>
    <text x="630" y="100" font-weight="600" fill="#333">LoadingScene</text>
    <text x="630" y="120" font-size="12" fill="#444">progress bar</text>

    <rect x="740" y="70" width="140" height="70" rx="10" fill="#e9f7e9" stroke="#3a9a3a" stroke-width="2"/>
    <text x="810" y="100" font-weight="600" fill="#1f5c1f">MainScene</text>
    <text x="810" y="120" font-size="12" fill="#444">the level</text>
  </g>

  <g stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="160" y1="105" x2="198" y2="105"/>
    <line x1="340" y1="105" x2="378" y2="105"/>
    <line x1="520" y1="105" x2="558" y2="105"/>
    <line x1="700" y1="105" x2="738" y2="105"/>
    <path d="M810,140 C810,215 450,215 450,142"/>
  </g>
  <text x="630" y="225" text-anchor="middle" font-size="12" fill="#444">Win / Lose ▸ Next · Retry · Home (an interstitial ad may show here, paced)</text>
</svg>

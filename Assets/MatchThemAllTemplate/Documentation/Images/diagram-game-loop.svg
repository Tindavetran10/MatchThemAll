<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="600" fill="#222">One level, step by step</text>

  <g font-size="14" text-anchor="middle">
    <rect x="30" y="60" width="170" height="70" rx="10" fill="#e8f1ff" stroke="#3b78d8" stroke-width="2"/>
    <text x="115" y="90" font-weight="600" fill="#1d3f7a">1. Tap an item</text>
    <text x="115" y="110" font-size="12" fill="#444">in the 3D pile</text>

    <rect x="250" y="60" width="190" height="70" rx="10" fill="#e8f1ff" stroke="#3b78d8" stroke-width="2"/>
    <text x="345" y="90" font-weight="600" fill="#1d3f7a">2. It slides into the tray</text>
    <text x="345" y="110" font-size="12" fill="#444">next to its own kind</text>

    <rect x="490" y="60" width="190" height="70" rx="10" fill="#e9f7e9" stroke="#3a9a3a" stroke-width="2"/>
    <text x="585" y="90" font-weight="600" fill="#1f5c1f">3. Three alike merge</text>
    <text x="585" y="110" font-size="12" fill="#444">tray slots free up</text>

    <rect x="710" y="60" width="170" height="70" rx="10" fill="#e9f7e9" stroke="#3a9a3a" stroke-width="2"/>
    <text x="795" y="90" font-weight="600" fill="#1f5c1f">4. Goal card</text>
    <text x="795" y="110" font-size="12" fill="#444">counts down by 3</text>
  </g>
  <g stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="200" y1="95" x2="248" y2="95"/>
    <line x1="440" y1="95" x2="488" y2="95"/>
    <line x1="680" y1="95" x2="708" y2="95"/>
    <path d="M795,60 C795,20 115,20 115,58" stroke-dasharray="6 4"/>
  </g>
  <text x="455" y="45" text-anchor="middle" font-size="12" fill="#666">keep tapping</text>

  <text x="450" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#222">How the level ends</text>
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="200" width="260" height="110" rx="10" fill="#e9f7e9" stroke="#3a9a3a" stroke-width="2"/>
    <text x="160" y="228" font-weight="600" font-size="15" fill="#1f5c1f">Win</text>
    <text x="160" y="252" fill="#333">every goal card reaches 0</text>
    <text x="160" y="274" fill="#333">stars from time left</text>
    <text x="160" y="294" fill="#333">coins: base + per star</text>

    <rect x="320" y="200" width="260" height="110" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
    <text x="450" y="228" font-weight="600" font-size="15" fill="#8e2a20">Game Over</text>
    <text x="450" y="252" fill="#333">every tray slot is full</text>
    <text x="450" y="274" fill="#333">and no three alike</text>
    <text x="450" y="294" fill="#333">Retry or Home</text>

    <rect x="610" y="200" width="260" height="110" rx="10" fill="#fff4e0" stroke="#d68910" stroke-width="2"/>
    <text x="740" y="228" font-weight="600" font-size="15" fill="#7d5108">Out of time</text>
    <text x="740" y="252" fill="#333">timer reaches 0</text>
    <text x="740" y="274" fill="#333">Continue: +30 s for coins</text>
    <text x="740" y="294" fill="#333">or a rewarded ad</text>
  </g>

  <rect x="30" y="335" width="840" height="75" rx="10" fill="#f6f2ff" stroke="#7d5fc9" stroke-width="2"/>
  <text x="450" y="362" text-anchor="middle" font-size="14" font-weight="600" fill="#4a347f">Power-ups (bottom bar) help at any time</text>
  <text x="450" y="386" text-anchor="middle" font-size="13" fill="#333">Vacuum: collects 3 goal items · Spring: throws a tray item back · Fan: blasts the pile apart · Freeze Gun: stops the timer</text>
  <text x="450" y="403" text-anchor="middle" font-size="12" fill="#555">at 0 charges a popup offers coins or a rewarded ad (never spent silently)</text>
</svg>
